<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도파민 왕국: 확률의 군주 (Dopamine Kingdom)</title>
    <style>
        /* 화려하고 엄숙한 왕궁의 알현실 비주얼 테마 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), 
                        url('https://images.unsplash.com/photo-1599733589046-9b8308b5b50d?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Georgia', 'Malgun Gothic', serif;
            color: #e0d8b4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .palace-window {
            width: 95%;
            max-width: 750px;
            background: rgba(28, 20, 14, 0.98);
            border: 4px double #d4af37;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
            margin: 20px 0;
            box-sizing: border-box;
        }

        /* 로그인 스크린 */
        #login-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .crown-emblem {
            font-size: 4.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #d4af37;
        }

        /* 메인 게임 레이아웃 */
        #game-screen {
            display: none;
        }

        .throne-title {
            text-align: center;
            font-size: 2.2rem;
            color: #d4af37;
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
        }

        .day-counter {
            text-align: center;
            font-size: 1.2rem;
            color: #ffffff;
            background: rgba(212, 175, 55, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 1px solid #d4af37;
        }

        /* 5대 왕실 핵심 스탯 그리드 */
        .royal-stats-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: rgba(46, 34, 24, 0.85);
            border: 2px solid #d4af37;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .royal-stats-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .stat-card {
            text-align: center;
            background: rgba(20, 14, 10, 0.7);
            border: 1px solid #6b5328;
            padding: 8px 4px;
            border-radius: 4px;
        }

        .stat-card.health-card {
            border-color: #e43f5a;
            background: rgba(228, 63, 90, 0.1);
        }

        .stat-label {
            font-size: 0.8rem;
            color: #bfae8a;
            margin-bottom: 4px;
        }

        .stat-val {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* 타임라인 진행 인디케이터 */
        .timeline-indicator {
            display: flex;
            justify-content: space-between;
            background: #231911;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 0.75rem;
            border: 1px solid #423321;
            overflow-x: auto;
            white-space: nowrap;
            gap: 5px;
        }

        .timeline-step {
            color: #7c6f5a;
            padding: 4px 8px;
            border-radius: 3px;
        }

        .timeline-step.current {
            background: #d4af37;
            color: #1a120b;
            font-weight: bold;
        }

        /* 서브 루프 스테이지 패널 */
        .stage-panel {
            background: rgba(38, 27, 19, 0.9);
            border: 1px dashed #d4af37;
            padding: 25px;
            border-radius: 6px;
            min-height: 280px;
            box-sizing: border-box;
        }

        .stage-header {
            color: #d4af37;
            font-size: 1.4rem;
            margin-top: 0;
            border-bottom: 1px solid #54412d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* 버튼 및 폼 인터페이스 */
        .palace-input {
            width: 100%;
            padding: 12px;
            background: #1c130c;
            border: 1px solid #8c734b;
            color: #ffffff;
            font-size: 1.05rem;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .palace-select {
            width: 100%;
            padding: 12px;
            background: #1c130c;
            border: 1px solid #8c734b;
            color: #ffffff;
            font-size: 1.05rem;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .palace-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(#d4af37, #b28f24);
            border: 1px solid #846512;
            color: #1a120b;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.3);
            margin-top: 10px;
        }

        .palace-btn:hover {
            background: linear-gradient(#e5c158, #c69b2b);
        }

        .palace-btn.action-next {
            background: linear-gradient(#2ecc71, #27ae60);
            color: #fff;
            border-color: #219653;
            margin-top: 20px;
        }

        .palace-btn.action-next:hover {
            background: linear-gradient(#2efb83, #2ecc71);
        }

        .palace-btn.danger-shoot {
            background: linear-gradient(#e43f5a, #b9132c);
            color: white;
            border-color: #8c0a1c;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .palace-btn.danger-shoot:hover {
            background: linear-gradient(#ff526e, #d61c39);
        }

        /* 결과 출력 로그 창 */
        .report-box {
            margin-top: 20px;
            padding: 15px;
            background: #1c140d;
            border-left: 4px solid #d4af37;
            border-radius: 3px;
            color: #ffffff;
            font-size: 0.98rem;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* 3택 음식 접시 디자인 */
        .food-table {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 20px 0;
        }

        .food-plate {
            flex: 1;
            background: #2b1f15;
            border: 2px solid #6b5328;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .food-plate:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            background: #3d2c1e;
        }

        .food-emoji {
            font-size: 2.8rem;
            margin-bottom: 8px;
        }

        .food-name {
            font-size: 0.95rem;
            color: #e0d8b4;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="palace-window">

    <!-- ================= 로그인 화면 ================= -->
    <div id="login-screen">
        <div class="crown-emblem">👑</div>
        <h1 style="color: #d4af37; margin-bottom: 10px;">도파민 왕국 (Dopamine Kingdom)</h1>
        <p style="color: #a89f78; margin-bottom: 30px;">확률과 도박으로 다스리는 무자비한 왕좌에 오르십시오.</p>
        
        <label for="monarch-name" style="display:block; text-align:left; margin-bottom: 8px; color: #e0d8b4;">군주의 휘호를 입력하십시오:</label>
        <input type="text" id="monarch-name" class="palace-input" placeholder="예: 루이 14세, 세종대왕, 엘리자베스" value="도파민">
        
        <button class="palace-btn" onclick="ascendThrone()">왕좌에 등극하기</button>
    </div>

    <!-- ================= 메인 게임 스크린 ================= -->
    <div id="game-screen">
        <h2 class="throne-title" id="display-title">👑 도파민 국왕의 알현실</h2>
        <div class="day-counter" id="display-day">Day 1</div>

        <!-- 5대 왕실 스탯 표시 창 (국고, 군사력, 민심, 인구, 체력) -->
        <div class="royal-stats-container">
            <div class="stat-card">
                <div class="stat-label">🏛️ 국고</div>
                <div class="stat-val" id="stat-gold">1,000</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🛡️ 군사력</div>
                <div class="stat-val" id="stat-military">150</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">👥 민심</div>
                <div class="stat-val" id="stat-loyalty">60%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🌾 인구</div>
                <div class="stat-val" id="stat-population">500</div>
            </div>
            <div class="stat-card health-card">
                <div class="stat-label" style="color:#ff526e;">❤️ 체력</div>
                <div class="stat-val" id="stat-health" style="color:#ff526e;">100</div>
            </div>
        </div>

        <!-- 8단계 루프 진행상황 인디케이터 -->
        <div class="timeline-indicator" id="timeline-bar">
            <span class="timeline-step" id="tl-1">1. 기상(총)</span>
            <span class="timeline-step" id="tl-2">2. 아침식사</span>
            <span class="timeline-step" id="tl-3">3. 오전업무</span>
            <span class="timeline-step" id="tl-4">4. 점심식사</span>
            <span class="timeline-step" id="tl-5">5. 오후업무</span>
            <span class="timeline-step" id="tl-6">6. 저녁식사</span>
            <span class="timeline-step" id="tl-7">7. 체력강화</span>
            <span class="timeline-step" id="tl-8">8. 취침</span>
        </div>

        <!-- 단계별 실시간 화면 출력 컨테이너 -->
        <div id="stage-content-panel" class="stage-panel">
            <!-- 자바스크립트에 의해 매 유저 인터랙션마다 동적으로 변경되는 구역 -->
        </div>
    </div>

</div>

<script>
    // 상태 변수 정의 (5대 핵심 스탯)
    let gameDay = 1;
    let monarchName = "";
    let currentStep = 1; // 1부터 8까지의 타임라인 고정 스텝 상태값

    let stats = {
        gold: 1000,
        military: 150,
        loyalty: 60,
        population: 500,
        health: 100
    };

    // 로그인 진행 기능
    function ascendThrone() {
        const nameInput = document.getElementById('monarch-name').value.trim();
        if(!nameInput) {
            alert("군주의 이름을 공백 없이 적어주십시오.");
            return;
        }
        monarchName = nameInput;
        document.getElementById('display-title').innerText = `👑 ${monarchName} 왕의 알현실`;
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        currentStep = 1;
        updateStatsUI();
        loadTimelineStage();
    }

    // 게임 상태 실시간 렌더링 및 패배/사망 엔딩 체크 수문장 리스트
    function updateStatsUI() {
        document.getElementById('stat-gold').innerText = stats.gold.toLocaleString();
        document.getElementById('stat-military').innerText = stats.military.toLocaleString() + " 명";
        document.getElementById('stat-loyalty').innerText = stats.loyalty + "%";
        document.getElementById('stat-population').innerText = stats.population.toLocaleString() + " 명";
        document.getElementById('stat-health').innerText = stats.health;
        document.getElementById('display-day').innerText = `Day ${gameDay}`;

        // 상한선 제한 처리 조치
        if(stats.loyalty > 100) stats.loyalty = 100;
        if(stats.health > 200) stats.health = 200;

        // 5가지 자원 중 단 하나라도 0 이하로 파산하면 무자비한 게임오버 발동
        if (stats.gold <= 0) {
            triggerGameOver("🏛️ 국고 파산 엔딩: 재정 파탄으로 왕실 채권단과 용병들이 성문을 파괴하고 들어왔습니다.");
        } else if (stats.military <= 0) {
            triggerGameOver("⚔️ 국방 함락 엔딩: 국경을 지킬 군사력이 소멸하여 이웃 제국의 기습 병합을 당했습니다.");
        } else if (stats.loyalty <= 0) {
            triggerGameOver("🔥 민중 반란 엔딩: 백성들의 적개심이 분노를 넘어서 폭동을 유발해 왕좌를 끌어내렸습니다.");
        } else if (stats.population <= 0) {
            triggerGameOver("💀 유령 도시 엔딩: 감당할 수 없는 실책으로 영토 내 백성들이 모두 야반도주하여 아무도 살지 않는 성이 되었습니다.");
        } else if (stats.health <= 0) {
            triggerGameOver("☠️ 과로사 및 병사 엔딩: 국왕의 육체적 체력이 한계에 도달하여 침소에서 숨을 거두었습니다.");
        }
    }

    function triggerGameOver(reason) {
        alert(`${reason}\n\n[게임 오버] ${monarchName} 왕의 통치는 Day ${gameDay}에서 막을 내립니다.`);
        location.reload();
    }

    // 8단계 순환형 고정 타임라인 관리 엔진
    function loadTimelineStage() {
        // 타임라인 상단 하이라이트 제어 바 초기화 및 적용
        for(let i=1; i<=8; i++) {
            document.getElementById(`tl-${i}`).classList.remove('current');
        }
        document.getElementById(`tl-${currentStep}`).classList.add('current');

        const panel = document.getElementById('stage-content-panel');
        panel.innerHTML = ""; // 구역 리셋 후 순차 진입

        if (currentStep === 1) {
            renderStep1(panel);
        } else if (currentStep === 2) {
            renderStep2(panel);
        } else if (currentStep === 3) {
            renderStep3(panel);
        } else if (currentStep === 4) {
            renderStep4(panel);
        } else if (currentStep === 5) {
            renderStep5(panel);
        } else if (currentStep === 6) {
            renderStep6(panel);
        } else if (currentStep === 7) {
            renderStep7(panel);
        } else if (currentStep === 8) {
            renderStep8(panel);
        }
    }

    function goToNextStep() {
        currentStep++;
        if (currentStep > 8) {
            currentStep = 1;
            gameDay++;
        }
        updateStatsUI();
        loadTimelineStage();
    }

    /* =========================================================================
       [1단계: 기상 권총 러시안 룰렛]
       ========================================================================= */
    function renderStep1(container) {
        container.innerHTML = `
            <h3 class="stage-header">🔫 1단계 : 침소의 기상식 (러시안 룰렛)</h3>
            <p>국왕이시여, 눈을 뜨셨군요. 도파민 왕국의 아침은 권총 격발로 시작됩니다. 6발 중 1발(약 16.6%)은 실탄이 들어있습니다. 운명을 시험하십시오.</p>
            <button class="palace-btn danger-shoot" id="btn-roulette-shoot" onclick="triggerRussianRoulette()">실린더 당기기 및 격발</button>
            <div id="roulette-shoot-report" class="report-box" style="display:none;"></div>
            <button class="palace-btn action-next" id="btn-roulette-next" style="display:none;" onclick="goToNextStep()">무사히 살아남아 아침 식사하러 가기</button>
        `;
    }

    function triggerRussianRoulette() {
        const dice = Math.floor(Math.random() * 6) + 1; // 1~6 무작위 난수
        const report = document.getElementById('roulette-shoot-report');
        const shootBtn = document.getElementById('btn-roulette-shoot');
        const nextBtn = document.getElementById('btn-roulette-next');

        shootBtn.style.display = 'none';
        report.style.display = 'block';

        if (dice === 1) {
            report.innerHTML = `<span style="color:#e43f5a; font-weight:bold;">💥 [탕!!!] 차가운 격발음과 함께 총탄이 머리를 뚫었습니다... 당신은 즉사하셨습니다.</span>`;
            setTimeout(() => {
                triggerGameOver("🔫 러시안 룰렛 사망 엔딩: 운 없는 기상 권총 도박에서 실탄이 발사되었습니다.");
            }, 1500);
        } else {
            stats.health += 5; // 생존 쾌감으로 체력 소폭 증가 보너스 조치
            report.innerHTML = `<span style="color:#2ecc71; font-weight:bold;">클릭... 틱! 💨 [공이치기 소리만 울림]\n천만다행입니다! 빈 약실이었습니다. 아드레날린과 도파민이 전신을 감쌉니다. (체력 +5)</span>`;
            nextBtn.style.display = 'block';
            updateStatsUI();
        }
    }

    /* =========================================================================
       [2단계: 아침 식사 독 도박 (3택 극단적 사망 룰)]
       ========================================================================= */
    function renderStep2(container) {
        container.innerHTML = `
            <h3 class="stage-header">🍳 2단계 : 아침 식사 (33% 확률의 즉사 밥상)</h3>
            <p>시종들이 세 종류의 아침 요리를 준비했습니다. 이 중 **하나의 접시**에는 암살자의 치명적인 맹독이 발라져 있습니다. 생존 시 민심과 체력이 차오릅니다.</p>
            <div class="food-table">
                <div class="food-plate" onclick="handleMeal('breakfast', 1)">
                    <div class="food-emoji">🍞</div>
                    <div class="food-name">거친 호밀빵</div>
                </div>
                <div class="food-plate" onclick="handleMeal('breakfast', 2)">
                    <div class="food-emoji">🥣</div>
                    <div class="food-name">오트밀 죽</div>
                </div>
                <div class="food-plate" onclick="handleMeal('breakfast', 3)">
                    <div class="food-emoji">🥓</div>
                    <div class="food-name">바짝 구운 베이컨</div>
                </div>
            </div>
            <div id="breakfast-meal-report" class="report-box" style="display:none;"></div>
            <button class="palace-btn action-next" id="btn-breakfast-next" style="display:none;" onclick="goToNextStep()">소화를 시키며 오전 국정 업무실로 이동</button>
        `;
    }

    /* =========================================================================
       [4단계: 점심 식사 독 도박 (3택 극단적 사망 룰)]
       ========================================================================= */
    function renderStep4(container) {
        container.innerHTML = `
            <h3 class="stage-header">🍱 4단계 : 점심 식사 (33% 확률의 즉사 만찬)</h3>
            <p>오전 업무를 마치고 찾아온 점심시간입니다. 아침과 동일하게 왕실 요리사가 내온 세 요리 중 **단 하나는 맹독 접시**입니다. 무사 통과 시 큰 스탯 혜택이 주어집니다.</p>
            <div class="food-table">
                <div class="food-plate" onclick="handleMeal('lunch', 1)">
                    <div class="food-emoji">🍗</div>
                    <div class="food-name">칠면조 다리구이</div>
                </div>
                <div class="food-plate" onclick="handleMeal('lunch', 2)">
                    <div class="food-emoji">🍲</div>
                    <div class="food-name">양고기 스튜</div>
                </div>
                <div class="food-plate" onclick="handleMeal('lunch', 3)">
                    <div class="food-emoji">🥧</div>
                    <div class="food-name">달콤한 미트파이</div>
                </div>
            </div>
            <div id="lunch-meal-report" class="report-box" style="display:none;"></div>
            <button class="palace-btn action-next" id="btn-lunch-next" style="display:none;" onclick="goToNextStep()">포만감을 느끼며 오후 국정 업무실로 이동</button>
        `;
    }

    /* =========================================================================
       [6단계: 저녁 식사 독 도박 (3택 극단적 사망 룰)]
       ========================================================================= */
    function renderStep6(container) {
        container.innerHTML = `

    function executeMultiFinanceRoulette() {
        const betInput = document.getElementById('roulette-single-bet');
        const countSelect = document.getElementById('roulette-loop-count');
        const report = document.getElementById('roulette-multi-report');

        let singleCost = parseInt(betInput.value);
        let loops = parseInt(countSelect.value);
        let totalCost = singleCost * loops;

        if (isNaN(singleCost) || singleCost <= 0) {
            report.innerText = "🚨 국고 베팅 수치가 정상이 아닙니다.";
            return;
        }

        if (stats.gold < totalCost) {
            report.innerText = `🚨 [베팅 불가능]\n현재 선택한 ${loops}회 연속 가동에 요구되는 비용은 총 ${totalCost} Gold입니다.\n하지만 보유하고 계신 국고는 현재 ${stats.gold} Gold뿐입니다.`;
            return;
        }

        let totalWinnings = 0;
        let historyArray = [];

        // 확정 배율 확률 풀리스트 
        // 0.0배(꽝: 45%) / 0.5배(반타작: 20%) / 1.3배(소소: 20%) / 2.5배(중박: 10%) / 5.0배(왕실잭팟: 5%)
        for (let i = 1; i <= loops; i++) {
            stats.gold -= singleCost; // 선 베팅 차감 조치
            let r = Math.random();
            let mult = 0;
            let title = "";

            if (r < 0.45) {
                mult = 0.0;
                title = "💥 [꽝] 투자 전액 증발";
            } else if (r < 0.65) {
                mult = 0.5;
                title = "🤕 [반손실] 반이라도 건짐";
            } else if (r < 0.85) {
                mult = 1.3;
                title = "💰 [이득] 1.3배 약소 증식";
            } else if (r < 0.95) {
                mult = 2.5;
                title = "🔥 [더블+] 2.5배 중대 대박";
            } else {
                mult = 5.0;
                title = "👑 [왕실 대폭발] 5.0배 슈퍼 초잭팟";
            }

            let winGold = Math.floor(singleCost * mult);
            stats.gold += winGold; // 즉각 국고 지급 연산
            totalWinnings += winGold;

            historyArray.push(`   ▶ [${i}회차 추첨] 결과 : ${title} ➔ 획득액: +${winGold} Gold`);
        }

        let profitLoss = totalWinnings - totalCost;
        let profitSign = profitLoss >= 0 ? `🟢 순수 이익 합산: +${profitLoss} Gold` : `🔴 순수 손실 합산: ${profitLoss} Gold`;

        report.innerText = `🎰 [오후 재정 룰렛 총 ${loops}회 다중 연산 결과 보고]\n` +
                           `${historyArray.join('\n')}\n` +
                           `-----------------------------------------------------\n` +
                           `💰 지출한 총 판돈 : -${totalCost} Gold\n` +
                           `💰 회수한 총 금액 : +${totalWinnings} Gold\n` +
                           `📊 ${profitSign}`;

        updateStatsUI();
    }

            } else {
                stats.population -= 50;
                report.innerHTML = `<span style="color:#e43f5a; font-weight:bold;">💥 [강화 처참히 실패] 제단의 부작용으로 영토 내 가구 50명이 공포를 느끼고 국경 밖으로 망명했습니다. (인구 -50 명)</span>`;
            }
        }

        updateStatsUI();
    }

    /* =========================================================================
       [8단계: 잠자기 및 익일(Day) 회전 준비]
       ========================================================================= */
    function renderStep8(container) {
        container.innerHTML = `
            <h3 class="stage-header">💤 8단계 : 취침 및 밤의 정산 (하루의 마감)</h3>
            <p>오늘 하루도 온갖 확률 도박 속에서 용케 숨줄기를 붙잡고 살아남으셨습니다. 국왕의 눈꺼풀이 무거워집니다.</p>
            <div class="report-box">
🌙 [왕실 취침 정산 보고]
당일 살아남은 국왕의 위엄으로 백성들의 번식과 귀화가 일어납니다. (인구 +10명 유입)
반면, 거대한 밤의 유지비와 기사단 급료가 자동으로 지출됩니다. (국고 -40 Gold)
또한 휴식을 통해 일정 수준의 체력이 미세 회복됩니다. (체력 +10 회복)
            </div>
            <button class="palace-btn" style="background:linear-gradient(#9b59b6, #8e44ad); color:#fff; border-color:#7d3c98;" onclick="executeSleepAndNextDay()">잠자기 및 내일 아침 눈뜨기</button>
        `;
    }

    function executeSleepAndNextDay() {
        // 밤 정산 자원 증감 적용
        stats.population += 10;
        stats.gold -= 40;
        stats.health += 10;

        // 하루 일과 루프 끝맺음 후 익일 아침 기상(스텝 1)으로 완전 강제 리셋 회전
        currentStep = 1;
        gameDay++;

        updateStatsUI();
        loadTimelineStage();
    }
</script>
