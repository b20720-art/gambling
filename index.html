<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도파민 왕국</title>
    <style>
        /* 도박장/왕국의 분위기를 내는 어두운 테마 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            border: 2px solid #d4af37;
            width: 300px;
            text-align: center;
        }
        h2 {
            color: #d4af37;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #f1c40f;
        }
        .toggle-link {
            display: block;
            margin-top: 15px;
            color: #aaa;
            font-size: 0.8em;
            cursor: pointer;
            text-decoration: underline;
        }
        .hidden {
            display: none !important;
        }
        #game-screen {
            border-color: #4CAF50;
            width: 80%;
            max-width: 800px;
        }
    </style>
</head>
<body>

    <!-- 로그인 화면 -->
    <div id="login-screen" class="container">
        <h2>왕국 입장 (로그인)</h2>
        <div class="input-group">
            <label for="login-id">군주 이름</label>
            <input type="text" id="login-id" placeholder="아이디를 입력하세요">
        </div>
        <div class="input-group">
            <label for="login-pw">비밀번호</label>
            <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요">
        </div>
        <button onclick="login()">입장하기</button>
        <span class="toggle-link" onclick="toggleScreen('signup-screen')">아직 나라를 건국하지 않으셨나요? (회원가입)</span>
    </div>

    <!-- 회원가입 화면 -->
    <div id="signup-screen" class="container hidden">
        <h2>새로운 건국 (회원가입)</h2>
        <div class="input-group">
            <label for="signup-id">군주 이름</label>
            <input type="text" id="signup-id" placeholder="사용할 아이디">
        </div>
        <div class="input-group">
            <label for="signup-pw">비밀번호</label>
            <input type="password" id="signup-pw" placeholder="사용할 비밀번호">
        </div>
        <div class="input-group">
            <label for="signup-country">국가 이름</label>
            <input type="text" id="signup-country" placeholder="예: 도파민 왕국">
        </div>
        <button onclick="signup()">건국하기</button>
        <span class="toggle-link" onclick="toggleScreen('login-screen')">이미 왕국이 있으신가요? (로그인)</span>
    </div>

    <!-- 메인 게임 화면 (비워둠) -->
    <div id="game-screen" class="container hidden">
        <h2 id="welcome-message" style="color: #4CAF50;"></h2>
        <p>이곳에 아슬아슬한 도박 통치 요소들이 추가될 예정입니다.</p>
        <button onclick="logout()" style="background-color: #c0392b; color: white; width: 50%; margin-top: 30px;">로그아웃</button>
    </div>

    <script>
        // 화면 전환 함수
        function toggleScreen(screenId) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // 회원가입 로직 (로컬 스토리지 사용)
        function signup() {
            const id = document.getElementById('signup-id').value;
            const pw = document.getElementById('signup-pw').value;
            const country = document.getElementById('signup-country').value;

            if (!id || !pw || !country) {
                alert("모든 정보를 입력해주세요!");
                return;
            }

            if (localStorage.getItem(id)) {
                alert("이미 존재하는 군주 이름입니다.");
                return;
            }

            const userData = { password: pw, country: country };
            localStorage.setItem(id, JSON.stringify(userData));
            
            alert(`${country} 건국을 축하드립니다! 이제 로그인해주세요.`);
            toggleScreen('login-screen');
            
            // 입력창 초기화
            document.getElementById('signup-id').value = '';
            document.getElementById('signup-pw').value = '';
            document.getElementById('signup-country').value = '';
        }

        // 로그인 로직
        function login() {
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;

            if (!id || !pw) {
                alert("군주 이름과 비밀번호를 입력해주세요.");
                return;
            }

            const storedData = localStorage.getItem(id);

            if (storedData) {
                const userData = JSON.parse(storedData);
                if (userData.password === pw) {
                    toggleScreen('game-screen');
                    document.getElementById('welcome-message').innerText = `환영합니다, ${userData.country}의 ${id} 전하!`;
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else {
                alert("존재하지 않는 군주입니다.");
            }
        }

        // 로그아웃 로직
        function logout() {
            toggleScreen('login-screen');
            document.getElementById('login-id').value = '';
            document.getElementById('login-pw').value = '';
        }
    </script>
</body>
</html>
